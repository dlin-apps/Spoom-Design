  <script>

    function gtag(){dataLayer.push(arguments);}

  <link rel="stylesheet" href="styles.css">

<body>
  <!-- Static fine grid background -->
  <div id="grid-bg"></div>

  <!-- Navigation (loaded from nav.html) -->
  <div id="nav-container"></div>

  <!-- Main content -->
  <main id="main">
    <section class="page">
      <div class="animate-in">
        <p class="eyebrow">Get In Touch</p>
        <h2 class="section-title">Contact</h2>
      </div>
      <div class="contact-grid animate-in" style="animation-delay: 0.15s">
        <div class="contact-card">
          <div class="contact-icon">✉️</div>
          <h4 class="contact-label">Email</h4>
          <p class="contact-value"><a href="mailto:email@spoomdesign.com">email@spoomdesign.com</a></p>
        </div>
        <div class="contact-card">
          <div class="contact-icon">📍</div>
          <h4 class="contact-label">Location</h4>
          <p class="contact-value">Burien, WA</p>
        </div>
        <div class="contact-card">
          <div class="contact-icon">💼</div>
          <h4 class="contact-label">LinkedIn</h4>
          <p class="contact-value"><a href="https://www.linkedin.com/company/spoom-design/" target="_blank" rel="noopener noreferrer">linkedin.com/company/spoom-design</a></p>
        </div>
      </div>
      <div class="contact-note animate-in" style="animation-delay: 0.3s">
        <p class="contact-note-text">Interested in collaboration, consulting, or just want to talk design and fintech? I'd love to hear from you.</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <span class="footer-text">© <span id="year"></span> Spoom Design LLC · Burien, WA</span>
  </footer>

  <script src="app.js"></script>
